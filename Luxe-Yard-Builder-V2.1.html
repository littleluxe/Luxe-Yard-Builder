<!doctype html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Luxe Yard Builder</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#201c1d;background:#f7f3f1}*{box-sizing:border-box}body{margin:0}header{padding:16px 20px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px}.tag{font-size:12px;color:#766}.wrap{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 66px)}aside{padding:18px;background:#fff;border-right:1px solid #ddd}label{display:block;font-size:12px;font-weight:800;margin:14px 0 6px}input,button,select{width:100%;padding:10px;border:1px solid #cfc6c3;border-radius:10px;background:#fff}button{font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#211d1e;color:#fff}.danger{color:#9b1c1c}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stageWrap{padding:20px;overflow:auto}.stage{position:relative;background:#fff;box-shadow:0 4px 24px #0002;overflow:hidden;transform-origin:top left;background-repeat:repeat}.piece{position:absolute;cursor:move;user-select:none;touch-action:none;transform-origin:center}.piece img{width:100%;height:100%;object-fit:contain;pointer-events:none}.piece.sel{outline:3px solid #ff4fa0;outline-offset:2px}.small{font-size:11px;color:#766;line-height:1.4}.pill{display:inline-block;padding:4px 7px;border-radius:99px;background:#f1e8e5;font-size:11px;font-weight:800}.stats{margin-top:12px;padding:10px;background:#faf7f6;border-radius:10px;font-size:12px}.hidden{display:none}@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}.stageWrap{padding:12px}}
</style></head><body>
<header><div><div class='brand'>Luxe Yard Builder ✨</div><div class='tag'>Free, local-first pattern sheet builder</div></div><span class='pill'>V2.1 BETA</span></header>
<div class='wrap'><aside>
<label>Fabric width (inches)</label><input id='fw' type='number' value='58' min='1' step='.25'>
<label>Yard length</label><input id='yards' type='number' value='1' min='.25' step='.25'>
<button id='resize'>Update canvas</button>
<label>Background color</label><input id='bg' type='color' value='#ffffff'>
<label>Seamless background</label><input id='pattern' type='file' accept='image/*'>
<label>Pattern scale</label><input id='pscale' type='range' min='25' max='500' value='150'>
<button id='clearBg'>Clear seamless</button>
<label>Upload projector PDF</label><input id='projector' type='file' accept='application/pdf,.pdf'>
<div id='pdfPanel' class='hidden'><label>PDF layers / size</label><select id='pdfSize'></select><div class='row'><button id='importPdf' class='primary'>Import selected size</button><button id='clearPdf'>Clear PDF</button></div><p class='small' id='pdfInfo'></p></div>
<label>Add pattern pieces / PNGs</label><input id='pieces' type='file' accept='image/*' multiple>
<div class='row'><button id='rotL'>↶ 15°</button><button id='rotR'>↷ 15°</button></div>
<div class='row'><button id='flipX'>Flip H</button><button id='flipY'>Flip V</button></div>
<div class='row'><button id='smaller'>− Size</button><button id='larger'>+ Size</button></div>
<div class='row'><button id='dup'>Duplicate</button><button id='del' class='danger'>Delete</button></div>
<button id='pack' class='primary'>✨ Auto Pack</button>
<button id='save'>Save Project</button><input id='load' type='file' accept='.json,application/json'>
<button id='png'>Export PNG</button>
<div class='stats' id='stats'></div>
<p class='small'>V2 Beta reads projector-PDF layers in your browser. Pick a size and import it at true physical scale. PDF processing stays on your device. Individual-piece auto-separation is the next importer upgrade.</p>
</aside><main class='stageWrap'><div id='stage' class='stage'></div></main></div>
<script src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs' type='module'></script>
<script type='module'>
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
window.pdfjsLib=pdfjsLib; window.dispatchEvent(new Event('pdfjsready'));
</script>
<script>
const DPI=12; const stage=document.querySelector('#stage'); let selected=null,pieces=[],bgData=null;
const $=s=>document.querySelector(s); const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sizeStage(){let w=+$ ('#fw').value,h=+$ ('#yards').value*36;stage.style.width=w*DPI+'px';stage.style.height=h*DPI+'px';renderStats()}
function select(p){pieces.forEach(x=>x.el.classList.remove('sel'));selected=p;if(p)p.el.classList.add('sel')}
function addPiece(src,x=20,y=20,w=180,h=180,rot=0,fx=1,fy=1){let el=document.createElement('div');el.className='piece';el.innerHTML=`<img src="${src}">`;stage.appendChild(el);let p={el,src,x,y,w,h,rot,fx,fy};pieces.push(p);bind(p);draw(p);select(p);renderStats()}
function draw(p){p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';p.el.style.width=p.w+'px';p.el.style.height=p.h+'px';p.el.style.transform=`rotate(${p.rot}deg) scale(${p.fx},${p.fy})`}
function bind(p){p.el.addEventListener('pointerdown',e=>{select(p);p.el.setPointerCapture(e.pointerId);let sx=e.clientX,sy=e.clientY,ox=p.x,oy=p.y;const mv=ev=>{p.x=clamp(ox+ev.clientX-sx,0,stage.clientWidth-p.w);p.y=clamp(oy+ev.clientY-sy,0,stage.clientHeight-p.h);draw(p)};const up=()=>{p.el.removeEventListener('pointermove',mv);p.el.removeEventListener('pointerup',up);renderStats()};p.el.addEventListener('pointermove',mv);p.el.addEventListener('pointerup',up)})}
function filesToData(files,cb){[...files].forEach(f=>{let r=new FileReader;r.onload=()=>cb(r.result);r.readAsDataURL(f)})}
$('#pieces').onchange=e=>filesToData(e.target.files,s=>addPiece(s));
$('#pattern').onchange=e=>filesToData(e.target.files,s=>{bgData=s;stage.style.backgroundImage=`url(${s})`;updatePattern()});
function updatePattern(){stage.style.backgroundSize=$('#pscale').value+'px auto'} $('#pscale').oninput=updatePattern;
$('#bg').oninput=e=>stage.style.backgroundColor=e.target.value;$('#clearBg').onclick=()=>{bgData=null;stage.style.backgroundImage='none'};$('#resize').onclick=sizeStage;
function mod(fn){if(selected){fn(selected);draw(selected);renderStats()}} $('#rotL').onclick=()=>mod(p=>p.rot-=15);$('#rotR').onclick=()=>mod(p=>p.rot+=15);$('#flipX').onclick=()=>mod(p=>p.fx*=-1);$('#flipY').onclick=()=>mod(p=>p.fy*=-1);$('#smaller').onclick=()=>mod(p=>{p.w*=.9;p.h*=.9});$('#larger').onclick=()=>mod(p=>{p.w*=1.1;p.h*=1.1});
$('#del').onclick=()=>{if(selected){selected.el.remove();pieces=pieces.filter(x=>x!==selected);selected=null;renderStats()}};$('#dup').onclick=()=>{if(selected)addPiece(selected.src,selected.x+20,selected.y+20,selected.w,selected.h,selected.rot,selected.fx,selected.fy)};
$('#pack').onclick=()=>{let pad=6,x=pad,y=pad,rowH=0;pieces.sort((a,b)=>b.h-a.h).forEach(p=>{if(x+p.w>stage.clientWidth-pad){x=pad;y+=rowH+pad;rowH=0}p.x=x;p.y=y;draw(p);x+=p.w+pad;rowH=Math.max(rowH,p.h)});renderStats()};
function renderStats(){let area=stage.clientWidth*stage.clientHeight||1,used=pieces.reduce((s,p)=>s+p.w*p.h,0),pct=Math.min(100,used/area*100);$('#stats').innerHTML=`Pieces: <b>${pieces.length}</b><br>Approx. occupied: <b>${pct.toFixed(1)}%</b><br>Approx. open space: <b>${(100-pct).toFixed(1)}%</b>`}
$('#save').onclick=()=>{let data={fw:+$('#fw').value,yards:+$('#yards').value,bg:$('#bg').value,bgData,pscale:+$('#pscale').value,pieces:pieces.map(({src,x,y,w,h,rot,fx,fy})=>({src,x,y,w,h,rot,fx,fy}))};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'luxe-yard-project.json')};
$('#load').onchange=e=>{let r=new FileReader;r.onload=()=>{let d=JSON.parse(r.result);pieces.forEach(p=>p.el.remove());pieces=[];$('#fw').value=d.fw;$('#yards').value=d.yards;$('#bg').value=d.bg;stage.style.backgroundColor=d.bg;bgData=d.bgData;$('#pscale').value=d.pscale||150;stage.style.backgroundImage=bgData?`url(${bgData})`:'none';updatePattern();sizeStage();d.pieces.forEach(p=>addPiece(p.src,p.x,p.y,p.w,p.h,p.rot,p.fx,p.fy))};r.readAsText(e.target.files[0])};
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#png').onclick=async()=>{let c=document.createElement('canvas');c.width=stage.clientWidth;c.height=stage.clientHeight;let ctx=c.getContext('2d');ctx.fillStyle=$('#bg').value;ctx.fillRect(0,0,c.width,c.height);if(bgData){let im=await loadImg(bgData),sw=+$ ('#pscale').value,sh=sw*im.height/im.width;for(let y=0;y<c.height;y+=sh)for(let x=0;x<c.width;x+=sw)ctx.drawImage(im,x,y,sw,sh)}for(let p of pieces){let im=await loadImg(p.src);ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.rotate(p.rot*Math.PI/180);ctx.scale(p.fx,p.fy);ctx.drawImage(im,-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}c.toBlob(b=>download(b,'luxe-yard.png'),'image/png')};
function loadImg(src){return new Promise((res,rej)=>{let i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=src})}
let pdfDoc=null,pdfGroups=[];
function waitPdf(){return new Promise(res=>{if(window.pdfjsLib)return res();window.addEventListener('pdfjsready',res,{once:true})})}
$('#projector').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('#pdfInfo').textContent='Reading projector PDF…';$('#pdfPanel').classList.remove('hidden');try{await waitPdf();let buf=await f.arrayBuffer();pdfDoc=await window.pdfjsLib.getDocument({data:buf}).promise;let page=await pdfDoc.getPage(1);let cfg=await pdfDoc.getOptionalContentConfig();let groupsObj=cfg.getGroups();pdfGroups=Array.isArray(groupsObj)?groupsObj:Object.values(groupsObj||{});let sizes=pdfGroups.filter(g=>/^(NB|\d+\s*[-/]?\s*\d*\s*(M|Y)?|\d+T)$/i.test((g.name||'').trim()));let sel=$('#pdfSize');sel.innerHTML='';(sizes.length?sizes:pdfGroups).forEach(g=>{let o=document.createElement('option');o.value=g.id;o.textContent=g.name;sel.appendChild(o)});$('#pdfInfo').textContent=`${pdfDoc.numPages} page PDF • ${pdfGroups.length} layers found • ${sizes.length||pdfGroups.length} selectable size layers. Choose your size, then import.`}catch(err){$('#pdfInfo').textContent='Could not read this PDF: '+err.message}}
$('#clearPdf').onclick=()=>{$('#projector').value='';$('#pdfPanel').classList.add('hidden');pdfDoc=null;pdfGroups=[]};
$('#importPdf').onclick=async()=>{if(!pdfDoc)return;let wanted=$('#pdfSize').value;if(!wanted)return;$('#pdfInfo').textContent='Rendering selected size at true scale…';try{let page=await pdfDoc.getPage(1),cfg=await pdfDoc.getOptionalContentConfig();for(let g of pdfGroups){let n=(g.name||'').toUpperCase();let keep=(g.id===wanted)||/INFO|GRID|BACKGROUND/.test(n);cfg.setVisibility(g.id,keep)}let base=page.getViewport({scale:1});let renderScale=1.5;let vp=page.getViewport({scale:renderScale});let c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);let cx=c.getContext('2d',{alpha:true});cx.clearRect(0,0,c.width,c.height);await page.render({canvasContext:cx,viewport:vp,optionalContentConfigPromise:Promise.resolve(cfg),background:'rgba(255,255,255,0)'}).promise;let data=c.toDataURL('image/png');let physicalW=base.width/72,physicalH=base.height/72;addPiece(data,0,0,physicalW*DPI,physicalH*DPI);$('#pdfInfo').textContent=`Imported ${$('#pdfSize').selectedOptions[0].textContent} at PDF physical scale (${physicalW.toFixed(1)} × ${physicalH.toFixed(1)} in). Drag it on the yard. Next upgrade: split the rendered size into individual pieces automatically.`}catch(err){$('#pdfInfo').textContent='Import failed: '+err.message}}
sizeStage();
</script></body></html>
